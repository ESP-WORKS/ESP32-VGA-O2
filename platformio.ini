; Odyssey 2 / Videopac G7000 emulator for LilyGO TTGO VGA32
; Family firmware (same host as Stella 2014 / Atari 2600 on this board).

[platformio]
default_envs = vga32
src_dir = src
lib_dir = lib

[env]
platform = espressif32@6.9.0
board = pico32
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
build_unflags =
    -std=gnu++11
    -mfix-esp32-psram-cache-issue
    -mfix-esp32-psram-cache-strategy=memw
build_flags =
    -O3
    -std=gnu++17
    -DFABGL_NO_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -D__LIBRETRO__
    -I include
    -I lib/o2em
lib_deps =
    https://github.com/fdivitto/FabGL.git#v1.0.9
lib_ldf_mode = chain+
extra_scripts =
    pre:extra_scripts/pre_fabgl.py

[env:vga32]
board_build.partitions = partitions/huge_app.csv
board_upload.offset_address = 0x10000

[env:vga32_bootloader]
board_build.partitions = partitions/bootloader.csv
board_build.app_partition_name = ota_0
board_upload.offset_address = 0x130000
board_upload.maximum_size = 2883584
